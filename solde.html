<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solde — GOOGLE TV AFRIQUE</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/admin-store.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.documentElement.classList.add('booting');
    const MEMBER = window.GTA ? GTA.requireActive() : null;
    if (MEMBER) document.documentElement.classList.remove('booting');
  </script>
  <style>
    :root {
      --bg: #0a0d13; --panel: #141a27; --line: rgba(255,255,255,.08);
      --text: #f1f4f9; --muted: #96a1b5; --red: #ea4335; --amber: #f5c451; --gold: #eab308; --gold-l: #f5c451;
      --grad: linear-gradient(135deg, #ea4335 0%, #c5221f 100%);
    }
    html.booting body { visibility: hidden; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(640px, 92%); margin-inline: auto; }
    header.top {
      position: sticky; top: 0; z-index: 40;
      background: rgba(10,13,19,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .top-in { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: .95rem; min-width: 0; }
    .brand-col { display: flex; flex-direction: column; gap: 2px; line-height: 1.15; min-width: 0; }
    .logo-badge { width: 32px; height: 32px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; }
    .logo-badge svg { width: 15px; height: 15px; fill: #fff; margin-left: 2px; }
    .logo b { color: #ff6a5e; }
    h1 { font-size: 1.15rem; font-weight: 800; }
    .hello { font-size: .7rem; font-weight: 700; color: #c5cddc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(62vw, 280px); }
    .hello b { color: #fff; }
    .st { display: inline-block; border-radius: 999px; padding: 2px 7px; font-size: .68rem; font-weight: 800; margin-left: 6px; }
    .st-wait { background: rgba(251, 146, 60, .18); color: #fdba74; }
    .st-ok { background: rgba(34, 197, 94, .18); color: #4ade80; }
    .st-no { background: rgba(248, 113, 113, .16); color: #fca5a5; }
    .balance {
      margin: 22px 0 16px;
      background: radial-gradient(420px 160px at 10% 0%, rgba(251,191,36,.16), transparent 60%), var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px 20px;
    }
    .balance p { color: var(--muted); font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .balance strong { display: block; font-size: 2rem; letter-spacing: -.03em; margin: 6px 0 14px; color: var(--gold-l); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini { background: rgba(10,13,19,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    .mini span { display: block; color: var(--muted); font-size: .75rem; font-weight: 600; }
    .mini b { font-size: 1.05rem; color: var(--gold-l); }
    .cta {
      display: block; text-align: center; margin-top: 14px;
      background: var(--grad); color: #fff; font-weight: 800;
      border-radius: 12px; padding: 12px 16px;
      box-shadow: 0 10px 26px -8px rgba(234, 67, 53, 0.65);
    }
    h2 { font-size: 1rem; margin: 8px 0 12px; }
    .tx { list-style: none; display: grid; gap: 8px; }
    .tx li {
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    }
    .tx small { display: block; color: var(--muted); font-size: .75rem; }
    .plus { color: #4ade80; font-weight: 800; }
    .minus { color: #fbbf24; font-weight: 800; }
    .empty { color: var(--muted); font-size: .9rem; padding: 12px 0; }
  </style>
</head>
<body>
<main class="page-main pb-20">
  <header class="top">
    <div class="wrap top-in">
      <a class="logo" href="espace.html">
        <span class="logo-badge"><svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-9.52-5.86A1 1 0 0 0 8 5.14Z"/></svg></span>
        <span class="brand-col">
          <span>GOOGLE <em>TV</em> <b>AFRIQUE</b></span>
          <span class="hello" id="welcome">Bienvenue</span>
        </span>
      </a>
    </div>
  </header>

  <div class="wrap" style="padding-top:8px">
    <section class="balance">
      <p>Solde disponible</p>
      <strong id="bal">0 FCFA</strong>
      <div class="split">
        <div class="mini"><span>En attente</span><b id="pend">0 FCFA</b></div>
        <div class="mini"><span>Pack</span><b id="pack">—</b></div>
      </div>
      <a class="cta" href="retrait.html">Demander un retrait</a>
    </section>

    <h2>Mouvements</h2>
    <ul class="tx" id="list"></ul>
  </div>
</main>
<script src="js/brand.js"></script>
<script>
GTA.renderBottomNav('solde');
function fmt(n) {
  return new Intl.NumberFormat('fr-FR').format(n || 0) + ' FCFA';
}
function wdBadge(st) {
  if (!st || st === 'done') return '';
  if (st === 'approved' || st === 'paid') return '<span class="st st-ok">Validé</span>';
  if (st === 'rejected') return '<span class="st st-no">Refusé</span>';
  if (st === 'pending') return '<span class="st st-wait">En attente</span>';
  return '';
}

document.addEventListener('DOMContentLoaded', () => {
  if (!MEMBER) return;
  const live = (typeof GTA.currentUser === 'function' && GTA.currentUser()) || MEMBER || {};
  const name = (typeof GTA.displayName === 'function' ? GTA.displayName(live) : (live.fullname || 'Membre'));
  const hello = document.getElementById('welcome');
  if (hello) hello.innerHTML = 'Bienvenue, <b>' + String(name).replace(/</g, '') + '</b>';
  const user = GTA.getWalletUser(MEMBER.email) || GTA.ensureWallet(MEMBER);
  document.getElementById('bal').textContent = fmt(user.balance);
  document.getElementById('pend').textContent = fmt(user.pending);
  document.getElementById('pack').textContent = (user.packLabel || user.pack || '—').replace(/\s*\(.+\)/, '');
  const list = document.getElementById('list');
  if (!user.tx.length) {
    list.innerHTML = '<li class="empty">Aucun mouvement pour le moment.</li>';
    return;
  }
  list.innerHTML = user.tx.slice(0, 12).map((t) => {
    const d = new Date(t.at);
    const when = isNaN(d) ? '' : d.toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    const credit = t.type === 'credit';
    return `<li>
      <div><b>${t.label}</b><small>${when} ${wdBadge(t.status)}</small></div>
      <span class="${credit ? 'plus' : 'minus'}">${credit ? '+' : '−'} ${fmt(t.amount)}</span>
    </li>`;
  }).join('');
});
</script>
</body>
</html>
